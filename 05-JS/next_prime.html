<!DOCTYPE html>
<html>

<head runat="server">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Exercise - Find Next Prime Number</title>

    <script type="text/javascript">
        function checkPrime() {
            var id = document.getElementById("num");
            var number = parseInt(id.value, 10);
            var maxNum = 1299827;

            if (!isNaN(number) && number >= 0 && number < maxNum) {
                for (var i = number + 1; i < maxNum; i++) {
                    if (isPrime(i)) {
                        document.getElementById("result").innerText = "Next Prime: " + i;
                        return;
                    }
                }
            } else {
                window.alert("Please Enter Number Below 1299827 or Enter A Valid Integer");
                id.value = "";
            }
        }

        function isPrime(num) {
            if (num < 2) return false;
            for (var i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    return false;
                }
            }
            return true;
        }
    </script>
</head>

<body>
    <form id="form1" runat="server">
        <div>
            <label for="num">Enter a number:</label>
            <input type="text" id="num" />
            <button id="btn" onclick="checkPrime(); return false;">
                Click To Get Next Prime Number
            </button>
            <br />
            <span id="result"></span>
        </div>
    </form>
</body>

</html>
